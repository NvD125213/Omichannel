<html>
  <head>
    <meta charset="utf-8" />
    <title>Omni default widget</title>
  </head>
  <body>
    <script>
      (function () {
        if (window.__OMNICHANNEL_CHAT_WIDGET_BOOTSTRAPPED__) return;
        window.__OMNICHANNEL_CHAT_WIDGET_BOOTSTRAPPED__ = true;

        var BASE_URL = "https://devchat.telesip.vn";
        // OmniHub API — GET/POST /public/live-chat/{token}/personas|contact
        var OMNI_API_BASE = "";

        window.__OMNICHANNEL_CHAT_WIDGET__ = {
          variant: "omni-default",
          baseUrl: BASE_URL,
          websiteToken: "yHgjQd9cktTpBCxpiA2o1WYj",
          omniApiBaseUrl: OMNI_API_BASE,
          assistantName: "Hỗ trợ",
          greetingMessage: "Xin chào! Chúng tôi có thể giúp gì cho bạn?",
          welcomeTagline: "",
          inputPlaceholder: "Nhập tin nhắn...",
          launcherPromptLabel: "Bạn có cần hỗ trợ gì không?",
          primaryColor: "#1f93ff",
          debug: true,
        };

        var s = document.createElement("script");
        s.src = "/inbox-widgets/default.js";
        s.async = true;
        s.dataset.omniDefaultWidget = "1";
        (document.head || document.body).appendChild(s);
      })();
    </script>
  </body>
</html>
