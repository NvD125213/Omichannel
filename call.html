    <script>
      (function (apiKey, callback) {
        var s = document.createElement("script");
        s.type = "text/javascript";
        s.async = true;

        s.onload = () => {
          if (window.CGVSDK) {
            window.CGVSDK.k = apiKey;
          }
          callback();
        };

        s.src = "https://sdk.telesip.vn/public/sdk.v2.min.js";

        var x = document.getElementsByTagName("script")[0];
        x.parentNode.insertBefore(s, x);
      })("your_api_key", () => {});

      setTimeout(function () {
        if (!window.CGVSDK) {
          console.error("CGVSDK chưa được load.");
          return;
        }

        var sdk = new window.CGVSDK(
          "demo.cgv.vn",
          "xxx",
          "101",
          {},
          {
            enableWidget: true,
            sipOnly: true,
            sipDomain: "demo.cgv.vn",
            wsServer: "wss://cgvcall.mobilesip.vn:7444",
            sipPassword: "ldCGV%2025!!!",
          },
        );

        // Gọi bằng widget: đặt ID trước khi bấm gọi
        window.currentSipCallId = crypto.randomUUID();

        const originalCall = sdk.call.bind(sdk);

        sdk.call = function (number, options) {
          options = options || {};

          options.params = Object.assign({}, options.params || {}, {
            callId: window.currentSipCallId,
          });

          return originalCall(number, options);
        };

        // Gọi bằng code
        window.makeCall = function (phone, callId) {
          return sdk.call(phone, {
            params: {
              callId: callId,
            },
          });
        };
      }, 5000);
    </script>
